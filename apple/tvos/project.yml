# XcodeGen spec (brew install xcodegen). Builds unsigned by default; the tvOS
# TestFlight job in .github/workflows/tvos.yml turns signing on from the command
# line. Needs build-tvos/libhamclock-core.a from cmake/TvOSCore built with
# cmake/TvOSToolchain.cmake (Simulator by default, -DCMAKE_OSX_SYSROOT=appletvos
# for devices).
# Same bundle id as the iOS app: tvOS is a platform of the "HamClock Pro" App
# Store record (universal purchase); see docs/apple-tv.md section 10.
name: HamClockTV
options:
  bundleIdPrefix: com.chrislaw.hamclockpro
  deploymentTarget:
    tvOS: "17.0"
targets:
  HamClockTV:
    type: application
    platform: tvOS
    sources:
      - App/Sources
      - App/Resources
      # The curated pass-alert catalog every HamClock Pro app ships (one file, edited in one place).
      - path: ../../src/widgets/satellites/amateur-satellites.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chrislaw.hamclockpro
        PRODUCT_NAME: HamClockTV
        INFOPLIST_FILE: App/Info.plist
        # iCloud key-value store for settings sync. Signed builds need iCloud
        # (key-value storage) enabled on the App ID first (docs/apple-tv.md section 11).
        CODE_SIGN_ENTITLEMENTS: App/HamClockTV.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
        TARGETED_DEVICE_FAMILY: "3"
        MARKETING_VERSION: "1.0.0"   # local builds; the TestFlight job passes the CMakeLists.txt version
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_OBJC_BRIDGING_HEADER: App/hcp-bridging-header.h
        HEADER_SEARCH_PATHS: ["$(SRCROOT)/Core"]
        LIBRARY_SEARCH_PATHS: ["$(SRCROOT)/../../build-tvos"]
        OTHER_LDFLAGS: ["-lhamclock-core", "-lc++"]
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGN_IDENTITY: ""
  # Siri Remote walk-through (XCUIRemote) on the tvOS Simulator: first-run setup,
  # pane chooser, pane options, a settings change that must survive a relaunch.
  HamClockTVUITests:
    type: bundle.ui-testing
    platform: tvOS
    sources: [UITests]
    dependencies:
      - target: HamClockTV
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chrislaw.hamclockpro.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: HamClockTV
        TARGETED_DEVICE_FAMILY: "3"
schemes:
  HamClockTV:
    build:
      targets:
        HamClockTV: all
        HamClockTVUITests: [test]
    test:
      targets: [HamClockTVUITests]
