# XcodeGen spec (brew install xcodegen) for the iPhone/iPad home-screen widgets.
# The same systemSmall widgets appear in StandBy and, from iOS 26, on the CarPlay
# dashboard. Built unsigned by default; the TestFlight job in
# .github/workflows/apple.yml embeds HamClockWidgets.appex into the Qt app's
# PlugIns/ and signs it (see docs/widgets-ios.md).
#
# Needs build-ios-core-<platform>/libhamclock-core.a (iphonesimulator, iphoneos):
# the Qt-free core (cmake/TvOSCore)
# built with cmake/IOSCoreToolchain.cmake (Simulator by default,
# -DCMAKE_OSX_SYSROOT=iphoneos for devices).
#
# Targets:
#   HamClockWidgets       the WidgetKit extension that ships inside the Qt app
#   HamClockWidgetsTests  hostless unit tests (core bridge, formatting, station
#                         share) and PNG snapshots of every widget family
#   WidgetHost            Simulator-only stand-in for the Qt app so the extension
#                         can be installed and registered without a Qt build; never shipped
name: HamClockWidgets
options:
  bundleIdPrefix: com.chrislaw.hamclockpro
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    HEADER_SEARCH_PATHS: ["$(SRCROOT)/../tvos/Core"]
    LIBRARY_SEARCH_PATHS: ["$(SRCROOT)/../../build-ios-core-$(PLATFORM_NAME)"]
    SWIFT_OBJC_BRIDGING_HEADER: Shared/hcp-bridging-header.h
    MARKETING_VERSION: "1.0.0"   # local builds; CI passes the CMakeLists.txt version
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGN_IDENTITY: ""
targets:
  HamClockWidgets:
    type: app-extension
    platform: iOS
    sources: [Shared, Widgets/Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chrislaw.hamclockpro.widgets
        PRODUCT_NAME: HamClockWidgets
        INFOPLIST_FILE: Widgets/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Widgets/HamClockWidgets.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        OTHER_LDFLAGS: ["-lhamclock-core", "-lc++"]
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
  HamClockWidgetsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Shared
      - path: Widgets/Sources
        excludes: ["HamClockWidgetBundle.swift"]
      - Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chrislaw.hamclockpro.widgets.tests
        GENERATE_INFOPLIST_FILE: YES
        OTHER_LDFLAGS: ["-lhamclock-core", "-lc++"]
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
  WidgetHost:
    type: application
    platform: iOS
    sources: [Host]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chrislaw.hamclockpro
        PRODUCT_NAME: WidgetHost
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: "HamClock Widgets Host"
    dependencies:
      - target: HamClockWidgets
        embed: true
        codeSign: false
schemes:
  HamClockWidgetsTests:
    build:
      targets:
        HamClockWidgetsTests: all
    test:
      targets: [HamClockWidgetsTests]
