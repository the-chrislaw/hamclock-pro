name: tvOS

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "apple/tvos/**"
      - "cmake/TvOS*.cmake"
      - "cmake/TvOSCore/**"
      - "src/domain/**"
      - "src/providers/**"
      - "tests/**"
      - ".github/workflows/tvos.yml"

permissions:
  contents: read

concurrency:
  group: tvos-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  core:
    name: Qt-free core (host tests + tvOS Simulator build)
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install ninja
        run: brew install ninja
      - name: Host build and tests
        run: |
          cmake -S cmake/TvOSCore -B build-host -G Ninja -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-host
          ctest --test-dir build-host --output-on-failure
      - name: Build for tvOS Simulator
        run: |
          cmake -S cmake/TvOSCore -B build-tvos -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/cmake/TvOSToolchain.cmake"
          cmake --build build-tvos
      - name: Run tests in tvOS Simulator
        run: |
          set -euo pipefail
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          for rt,devs in sorted(d.items()):
              if "tvOS" in rt and devs:
                  print(devs[0]["udid"]); break')
          test -n "$udid"
          xcrun simctl boot "$udid"
          fail=0
          ls -R build-tvos | head -40
          tests=$(find "$PWD/build-tvos" -type f -perm -u+x -name 'core-*-regression')
          test -n "$tests"
          for t in $tests; do
            echo "== $t"
            xcrun simctl spawn "$udid" "$t" || fail=1
          done
          xcrun simctl shutdown "$udid" || true
          exit $fail

  app:
    name: SwiftUI app (tvOS Simulator build + screenshot)
    needs: core
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: brew install ninja xcodegen
      - name: Select newest Xcode (current XcodeGen writes project format 77, Xcode 15 cannot open it)
        run: |
          x=$(ls -d /Applications/Xcode_16*.app /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          test -n "$x"
          sudo xcode-select -s "$x"
          xcodebuild -version
      - name: Build core for tvOS Simulator
        run: |
          cmake -S cmake/TvOSCore -B build-tvos -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/cmake/TvOSToolchain.cmake"
          cmake --build build-tvos --target hamclock-core
      - name: Build app
        run: |
          cd apple/tvos
          xcodegen generate
          xcodebuild -project HamClockTV.xcodeproj -scheme HamClockTV \
            -sdk appletvsimulator -configuration Debug -derivedDataPath "$RUNNER_TEMP/dd" \
            ARCHS=arm64 CODE_SIGNING_ALLOWED=NO build
      - name: Launch and screenshot
        run: |
          set -euo pipefail
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          for rt,devs in sorted(d.items()):
              if "tvOS" in rt and devs:
                  print(devs[0]["udid"]); break')
          xcrun simctl boot "$udid"
          app=$(find "$RUNNER_TEMP/dd" -name HamClockTV.app -type d | head -1)
          xcrun simctl install "$udid" "$app"
          xcrun simctl launch "$udid" com.chrislaw.hamclockpro.tv
          sleep 20
          mkdir -p shots
          xcrun simctl io "$udid" screenshot shots/tvos-dashboard.png
      - uses: actions/upload-artifact@v4
        with:
          name: tvos-simulator-screenshot
          path: shots/tvos-dashboard.png
