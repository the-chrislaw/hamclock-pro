name: Apple

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Rapid merges to main used to cancel each other's runs, so the main-only
# signing/notarization path never completed. Only PR runs are superseded now;
# each main push gets its own group and runs to completion.
concurrency:
  group: apple-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Qt for iOS/macOS used by the iOS job. Shared code must still build on Qt 6.4.
  IOS_QT_VERSION: "6.8.3"

jobs:
  macos:
    name: macOS build and tests
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: brew install qt ninja
      - name: Configure
        run: cmake -S . -B build-mac -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_PREFIX_PATH="$(brew --prefix qt)"
      - name: Build
        run: cmake --build build-mac
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build-mac --output-on-failure
      - name: Package app
        run: ditto -c -k --keepParent build-mac/hamclock-pro.app hamclock-pro-macos.zip
      - name: Check Info.plist
        run: |
          plutil -lint build-mac/hamclock-pro.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c "Print :LSApplicationCategoryType" build-mac/hamclock-pro.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" build-mac/hamclock-pro.app/Contents/Info.plist
          test -s build-mac/hamclock-pro.app/Contents/Resources/AppIcon.icns
          file build-mac/hamclock-pro.app/Contents/Resources/AppIcon.icns
          plutil -lint build-mac/hamclock-pro.app/Contents/Resources/PrivacyInfo.xcprivacy
          /usr/libexec/PlistBuddy -c "Print :NSPrivacyTracking" build-mac/hamclock-pro.app/Contents/Resources/PrivacyInfo.xcprivacy
      - name: Build unsigned dmg
        run: |
          # macdeployqt can print an hdiutil "Resource busy" error yet exit 0,
          # so retry on a missing dmg rather than on the exit status.
          for attempt in 1 2 3; do
            rm -f build-mac/hamclock-pro.dmg
            macdeployqt build-mac/hamclock-pro.app -qmldir="$GITHUB_WORKSPACE/src" -dmg || true
            [ -f build-mac/hamclock-pro.dmg ] && break
            [ "$attempt" = 3 ] && exit 1
            sleep 15
          done
          # The QML is loaded from resources, so macdeployqt must scan src/ (-qmldir)
          # to bundle QtQuick, Controls, Layouts, ... Prove the packaged app starts.
          test -d build-mac/hamclock-pro.app/Contents/Resources/qml/QtQuick
          build-mac/hamclock-pro.app/Contents/MacOS/hamclock-pro --config-dir "$RUNNER_TEMP/smoke-mac" --offline --size 1024x600 --screenshot "$RUNNER_TEMP/smoke-mac.png"
          test -s "$RUNNER_TEMP/smoke-mac.png"
          mv build-mac/hamclock-pro.dmg hamclock-pro-macos-unsigned.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: hamclock-pro-macos-unsigned
          path: |
            hamclock-pro-macos.zip
            hamclock-pro-macos-unsigned.dmg

  macos-universal:
    name: macOS universal build
    runs-on: macos-14
    # Produces the distributable dmg: universal (arm64+x86_64), signed/notarized when secrets exist.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Cache Qt install
        id: qt-cache
        uses: actions/cache@v4
        with:
          path: ~/Qt
          key: qt-${{ runner.os }}-${{ env.IOS_QT_VERSION }}-desktop-v1
      - name: Install Qt (universal desktop)
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: |
          python3 -m venv "$RUNNER_TEMP/aqt"
          "$RUNNER_TEMP/aqt/bin/pip" install aqtinstall
          "$RUNNER_TEMP/aqt/bin/aqt" install-qt mac desktop "$IOS_QT_VERSION" clang_64 --outputdir "$HOME/Qt"
      - name: Install ninja
        run: brew install ninja
      - name: Configure and build (arm64 + x86_64)
        run: |
          cmake -S . -B build-universal -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_PREFIX_PATH="$HOME/Qt/$IOS_QT_VERSION/macos"
          cmake --build build-universal
      - name: Check both architectures
        run: |
          lipo -archs build-universal/hamclock-pro.app/Contents/MacOS/hamclock-pro | tee archs.txt
          grep -q arm64 archs.txt && grep -q x86_64 archs.txt
      - name: Deploy Qt into the bundle (universal)
        run: |
          export PATH="$HOME/Qt/$IOS_QT_VERSION/macos/bin:$PATH"
          # hdiutil occasionally fails with "Resource busy" on hosted runners; retry.
          for attempt in 1 2 3; do
            rm -f build-universal/hamclock-pro.dmg
            macdeployqt build-universal/hamclock-pro.app -qmldir="$GITHUB_WORKSPACE/src" -dmg || true
            [ -f build-universal/hamclock-pro.dmg ] && break
            [ "$attempt" = 3 ] && exit 1
            sleep 15
          done
          # The QML is loaded from resources, so macdeployqt must scan src/ (-qmldir)
          # to bundle QtQuick, Controls, Layouts, ... Prove the packaged app starts.
          test -d build-universal/hamclock-pro.app/Contents/Resources/qml/QtQuick
          build-universal/hamclock-pro.app/Contents/MacOS/hamclock-pro --config-dir "$RUNNER_TEMP/smoke-universal" --offline --size 1024x600 --screenshot "$RUNNER_TEMP/smoke-universal.png"
          test -s "$RUNNER_TEMP/smoke-universal.png"
          mv build-universal/hamclock-pro.dmg hamclock-pro-macos-universal-unsigned.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: hamclock-pro-macos-universal-unsigned
          path: hamclock-pro-macos-universal-unsigned.dmg
      # Signing and notarization (issue #58). Main pushes and tags only, and every
      # step skips cleanly while the secrets are absent. Secrets are only passed
      # through env, never echoed; the keychain is temporary and deleted at the end.
      - name: Check signing secrets
        id: sign
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        env:
          CERT: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_PW: ${{ secrets.MACOS_CERT_PASSWORD }}
          KEY: ${{ secrets.ASC_KEY_P8_BASE64 }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          if [ -n "$CERT" ] && [ -n "$CERT_PW" ]; then echo "sign=true" >> "$GITHUB_OUTPUT"; else echo "Developer ID certificate secrets absent; skipping signing"; fi
          if [ -n "$KEY" ] && [ -n "$KEY_ID" ] && [ -n "$ISSUER" ]; then echo "notarize=true" >> "$GITHUB_OUTPUT"; else echo "App Store Connect API key secrets absent; skipping notarization"; fi
      - name: Sign app and dmg (Developer ID)
        if: steps.sign.outputs.sign == 'true'
        env:
          CERT: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_PW: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/signing.keychain-db"
          KCPW="$(uuidgen)"
          echo "KC=$KC" >> "$GITHUB_ENV"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          printf '%s' "$CERT" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PW" -A -t cert -f pkcs12 -k "$KC" >/dev/null
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KCPW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" login.keychain-db
          IDENTITY="$(security find-identity -v -p codesigning "$KC" | grep 'Developer ID Application' | head -1 | awk -F'"' '{print $2}')"
          test -n "$IDENTITY" || { echo "No Developer ID Application identity in the p12"; exit 1; }
          APP=build-universal/hamclock-pro.app
          find "$APP/Contents" \( -name '*.dylib' -o -name '*.framework' -o -name '*.so' \) -print0 | \
            xargs -0 -n1 codesign --force --options runtime --timestamp --sign "$IDENTITY"
          codesign --force --options runtime --timestamp --sign "$IDENTITY" "$APP"
          codesign --verify --deep --strict "$APP"
          rm -rf dmgroot && mkdir dmgroot && cp -R "$APP" dmgroot/ && ln -s /Applications dmgroot/Applications
          hdiutil create -volname "HamClock Pro" -srcfolder dmgroot -ov -format UDZO hamclock-pro-macos.dmg
          codesign --force --timestamp --sign "$IDENTITY" hamclock-pro-macos.dmg
      - name: Notarize and staple
        if: steps.sign.outputs.sign == 'true' && steps.sign.outputs.notarize == 'true'
        env:
          KEY: ${{ secrets.ASC_KEY_P8_BASE64 }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          printf '%s' "$KEY" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          xcrun notarytool submit hamclock-pro-macos.dmg --key "$RUNNER_TEMP/AuthKey.p8" \
            --key-id "$KEY_ID" --issuer "$ISSUER" --wait
          rm -f "$RUNNER_TEMP/AuthKey.p8"
          xcrun stapler staple hamclock-pro-macos.dmg
          xcrun stapler validate hamclock-pro-macos.dmg
      - name: Remove signing keychain
        if: always() && steps.sign.outputs.sign == 'true'
        run: |
          security delete-keychain "$KC" || true
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/AuthKey.p8"
      - uses: actions/upload-artifact@v4
        if: steps.sign.outputs.sign == 'true'
        with:
          name: hamclock-pro-macos-signed
          path: hamclock-pro-macos.dmg

  ios-simulator:
    name: iPad Simulator build
    runs-on: macos-14
    # Informational until the Qt Widgets dependency is removed (area A, QPainter
    # map renderer); a failure here does not block merges yet.
    continue-on-error: true
    timeout-minutes: 45
    env:
      # Qt 6.8.3's prebuilt QML resource objects are device-only (simulator link
      # fails); try the 6.5 LTS kit, which also checks our Qt 6.4+ compatibility.
      IOS_QT_VERSION: 6.5.3
    steps:
      - uses: actions/checkout@v4
      - name: Cache Qt install
        id: qt-cache
        uses: actions/cache@v4
        with:
          path: ~/Qt
          key: qt-${{ runner.os }}-${{ env.IOS_QT_VERSION }}-desktop-ios-v1
      - name: Install Qt (desktop host tools + iOS)
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: |
          python3 -m venv "$RUNNER_TEMP/aqt"
          "$RUNNER_TEMP/aqt/bin/pip" install aqtinstall
          AQT="$RUNNER_TEMP/aqt/bin/aqt"
          "$AQT" install-qt mac desktop "$IOS_QT_VERSION" clang_64 -m qtshadertools --outputdir "$HOME/Qt"
          "$AQT" install-qt mac ios "$IOS_QT_VERSION" ios --outputdir "$HOME/Qt"
      - name: Install ninja
        run: brew install ninja
      - name: Configure (device SDK)
        run: |
          "$HOME/Qt/$IOS_QT_VERSION/ios/bin/qt-cmake" -S . -B build-ios -G Xcode \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DQT_HOST_PATH="$HOME/Qt/$IOS_QT_VERSION/macos" \
            -DBUILD_TESTING=OFF
      - name: Build (compile and link check, unsigned)
        run: |
          cmake --build build-ios --config Debug --target hamclock-pro -- \
            -sdk iphoneos CODE_SIGNING_ALLOWED=NO
      # Simulator: Qt's prebuilt QML resource objects are device-only in this kit
      # ("building for iOS-simulator, but linking object built for iOS"), so the
      # Simulator build/screenshot is attempted separately and is informational.
      - name: Simulator build and screenshot (experimental)
        continue-on-error: true
        run: |
          # Qt's iOS kit ships its QML resource objects tagged for the device
          # only (LC_BUILD_VERSION platform iOS), which the simulator link
          # rejects. The code is plain arm64, so retag those objects for the
          # simulator. The device build above has already run, so changing the
          # local kit copy is safe (the cache is not saved on a hit).
          QTIOS="$HOME/Qt/$IOS_QT_VERSION/ios"
          find "$QTIOS" -path '*objects-*' -name '*.o' > objs.txt
          echo "retagging $(wc -l < objs.txt) objects"
          head -1 objs.txt | xargs xcrun vtool -show-build | head -8
          # (a while loop: BSD xargs -I limits the replaced command to 255 bytes)
          while IFS= read -r o; do
            xcrun vtool -set-build-version 7 15.0 17.5 -replace -output "$o" "$o" >/dev/null 2>&1 ||
              xcrun vtool -arch arm64 -set-build-version 7 15.0 17.5 -replace -output "$o" "$o" >/dev/null ||
              echo "retag failed: $o"
          done < objs.txt
          head -1 objs.txt | xargs xcrun vtool -show-build | head -8
          # The kit's static libraries (libQt6Quick_debug.a, ...) carry the same
          # device tag on their members: unpack, retag and repack each archive.
          find "$QTIOS" -name '*.a' > archives.txt
          echo "retagging members of $(wc -l < archives.txt) archives"
          while IFS= read -r a; do
            if [ -n "$(xcrun ar -t "$a" 2>/dev/null | grep -v '^__.SYMDEF' | sort | uniq -d | head -1)" ]; then
              echo "skip (duplicate member names): $a"; continue
            fi
            d=$(mktemp -d)
            ( cd "$d" && xcrun ar -x "$a" ) || { echo "unpack failed: $a"; rm -rf "$d"; continue; }
            for m in "$d"/*.o; do
              [ -e "$m" ] || continue
              xcrun vtool -set-build-version 7 15.0 17.5 -replace -output "$m" "$m" >/dev/null 2>&1 ||
                xcrun vtool -arch arm64 -set-build-version 7 15.0 17.5 -replace -output "$m" "$m" >/dev/null 2>&1 ||
                echo "retag failed: $m"
            done
            xcrun libtool -static -o "$d/new.a" "$d"/*.o 2>/dev/null && cp "$d/new.a" "$a" || echo "repack failed: $a"
            rm -rf "$d"
          done < archives.txt
          "$HOME/Qt/$IOS_QT_VERSION/ios/bin/qt-cmake" -S . -B build-sim -G Xcode \
            -DQT_HOST_PATH="$HOME/Qt/$IOS_QT_VERSION/macos" -DBUILD_TESTING=OFF
          if ! cmake --build build-sim --config Debug --target hamclock-pro -- \
              -sdk iphonesimulator -arch arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO \
              > sim-build.log 2>&1; then
            grep -E "error:|ld: |BUILD FAILED" sim-build.log | head -40
            exit 1
          fi
          APP=$(find build-sim -name 'hamclock-pro.app' -path '*Debug-iphonesimulator*' | head -1)
          UDID=$(xcrun simctl list devices available | grep -m1 'iPad' | grep -oE '[0-9A-F-]{36}')
          xcrun simctl boot "$UDID"
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" org.hamclockpro.app
          sleep 15
          xcrun simctl io "$UDID" screenshot ipad.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ipad-simulator-screenshot
          path: ipad.png
          if-no-files-found: ignore

  # TestFlight upload of the iPad device build (issue #269). Main pushes only;
  # every step skips cleanly while the App Store Connect secrets or APPLE_TEAM_ID
  # are absent. Cloud signing uses the API key, so no certificate or profile is
  # stored in the repo. The key file is deleted at the end; nothing is echoed.
  # Owner switch: uploads run only while the repository variable
  # TESTFLIGHT_UPLOADS is 'true'. The owner paused TestFlight until builds are
  # stable (2026-10-16); don't remove or bypass this condition.
  ios-testflight:
    name: iPad TestFlight upload
    runs-on: macos-15
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.TESTFLIGHT_UPLOADS == 'true'
    continue-on-error: true
    timeout-minutes: 60
    env:
      QT_VER: "6.8.3"
      BUNDLE_ID: com.chrislaw.hamclockpro
    steps:
      - uses: actions/checkout@v4
      # App Store Connect only accepts builds from the iOS 26 SDK (Xcode 26).
      - name: Select Xcode 26
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$X" ] || { echo "no Xcode 26 on this runner"; ls /Applications | grep -i xcode; exit 1; }
          sudo xcode-select -s "$X"
          xcodebuild -version
      - name: Check secrets
        id: gate
        env:
          KEY: ${{ secrets.ASC_KEY_P8_BASE64 }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          TEAM: ${{ vars.APPLE_TEAM_ID }}
          DIST: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          DIST_PW: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          if [ -n "$KEY" ] && [ -n "$KEY_ID" ] && [ -n "$ISSUER" ] && [ -n "$TEAM" ] && [ -n "$DIST" ] && [ -n "$DIST_PW" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; else echo "App Store Connect or Apple Distribution secrets or APPLE_TEAM_ID absent; skipping TestFlight"; fi
      - name: Cache Qt install
        if: steps.gate.outputs.go == 'true'
        id: qt-cache
        uses: actions/cache@v4
        with:
          path: ~/Qt
          key: qt-${{ runner.os }}-${{ env.QT_VER }}-desktop-ios-v1
      - name: Install Qt (desktop host tools + iOS)
        if: steps.gate.outputs.go == 'true' && steps.qt-cache.outputs.cache-hit != 'true'
        run: |
          python3 -m venv "$RUNNER_TEMP/aqt"
          "$RUNNER_TEMP/aqt/bin/pip" install aqtinstall
          AQT="$RUNNER_TEMP/aqt/bin/aqt"
          "$AQT" install-qt mac desktop "$QT_VER" clang_64 -m qtshadertools --outputdir "$HOME/Qt"
          "$AQT" install-qt mac ios "$QT_VER" ios --outputdir "$HOME/Qt"
      - name: Configure
        if: steps.gate.outputs.go == 'true'
        env:
          TEAM: ${{ vars.APPLE_TEAM_ID }}
        run: |
          brew install ninja
          "$HOME/Qt/$QT_VER/ios/bin/qt-cmake" -S . -B build-tf -G Xcode \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DQT_HOST_PATH="$HOME/Qt/$QT_VER/macos" \
            -DBUILD_TESTING=OFF \
            -DCMAKE_XCODE_ATTRIBUTE_DEVELOPMENT_TEAM="$TEAM" \
            -DCMAKE_XCODE_ATTRIBUTE_PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_STYLE=Automatic \
            -DCMAKE_XCODE_ATTRIBUTE_TARGETED_DEVICE_FAMILY=2
      - name: Import Apple Distribution certificate
        if: steps.gate.outputs.go == 'true'
        env:
          DIST: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          DIST_PW: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/ios-signing.keychain-db"
          KCPW="$(uuidgen)"
          echo "KC=$KC" >> "$GITHUB_ENV"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          printf '%s' "$DIST" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -P "$DIST_PW" -A -t cert -f pkcs12 -k "$KC" >/dev/null
          rm -f "$RUNNER_TEMP/dist.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KCPW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" login.keychain-db
          security find-identity -v -p codesigning "$KC" | grep -c 'Apple Distribution' || { echo "No Apple Distribution identity in the p12"; exit 1; }
      - name: Archive, export and upload
        if: steps.gate.outputs.go == 'true'
        env:
          KEY: ${{ secrets.ASC_KEY_P8_BASE64 }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          TEAM: ${{ vars.APPLE_TEAM_ID }}
        run: |
          KEYFILE="$RUNNER_TEMP/AuthKey_$KEY_ID.p8"
          printf '%s' "$KEY" | base64 --decode > "$KEYFILE"
          trap 'rm -f "$KEYFILE"' EXIT
          # Manual signing: the App Store profile is created through the API (the
          # key's App Manager role cannot create cloud-managed distribution profiles).
          python3 -m venv "$RUNNER_TEMP/asc"
          "$RUNNER_TEMP/asc/bin/pip" install --quiet pyjwt cryptography
          export ASC_KEY_FILE="$KEYFILE" ASC_KEY_ID="$KEY_ID" ASC_ISSUER_ID="$ISSUER"
          security find-certificate -c "Apple Distribution" -p "$KC" > "$RUNNER_TEMP/dist.pem"
          PROFILE_NAME="HamClockPro AppStore ${{ github.run_id }}"
          read -r PROFILE_ID PROFILE_UUID < <("$RUNNER_TEMP/asc/bin/python" packaging/apple/asc_profile.py \
            create "$BUNDLE_ID" "$RUNNER_TEMP/dist.pem" "$PROFILE_NAME" "$RUNNER_TEMP/profile.mobileprovision")
          echo "PROFILE_ID=$PROFILE_ID" >> "$GITHUB_ENV"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          # Build number must rise on every upload: use the run number.
          BUILD="${{ github.run_number }}"
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>$TEAM</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict><key>$BUNDLE_ID</key><string>$PROFILE_NAME</string></dict>
          </dict></plist>
          PLIST
          set -o pipefail
          xcodebuild archive -project build-tf/HamClockPro.xcodeproj -scheme hamclock-pro \
            -configuration Release -sdk iphoneos -archivePath "$RUNNER_TEMP/hc.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM" PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CURRENT_PROJECT_VERSION="$BUILD" CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KC" \
            2>&1 | tee tf-archive.log | tail -5 \
            || { grep -E "error:|BUILD FAILED" tf-archive.log | head -30; exit 1; }
          # Diagnostics: an app archive has Products/Applications and ApplicationProperties.
          ls "$RUNNER_TEMP/hc.xcarchive/Products" "$RUNNER_TEMP/hc.xcarchive/Products/Applications" || true
          /usr/libexec/PlistBuddy -c Print "$RUNNER_TEMP/hc.xcarchive/Info.plist" | grep -v -i "signing" || true
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/hc.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath "$KEYFILE" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER" \
            2>&1 | tee tf-export.log | tail -15 \
            || { grep -E "error:|rror Domain" tf-export.log | head -30; exit 1; }
      - name: Remove signing keychain and temporary profile
        if: always() && steps.gate.outputs.go == 'true'
        env:
          KEY: ${{ secrets.ASC_KEY_P8_BASE64 }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          if [ -n "$PROFILE_ID" ] && [ -x "$RUNNER_TEMP/asc/bin/python" ]; then
            printf '%s' "$KEY" | base64 --decode > "$RUNNER_TEMP/AuthKey_$KEY_ID.p8"
            ASC_KEY_FILE="$RUNNER_TEMP/AuthKey_$KEY_ID.p8" ASC_KEY_ID="$KEY_ID" ASC_ISSUER_ID="$ISSUER" \
              "$RUNNER_TEMP/asc/bin/python" packaging/apple/asc_profile.py delete "$PROFILE_ID" || true
          fi
          security delete-keychain "$KC" || true
          rm -f "$RUNNER_TEMP/dist.p12" "$RUNNER_TEMP"/AuthKey_*.p8
