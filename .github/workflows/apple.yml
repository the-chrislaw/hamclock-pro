name: Apple

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: apple-${{ github.ref }}
  cancel-in-progress: true

env:
  # Qt for iOS/macOS used by the iOS job. Shared code must still build on Qt 6.4.
  IOS_QT_VERSION: "6.8.3"

jobs:
  macos:
    name: macOS build and tests
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: brew install qt ninja
      - name: Configure
        run: cmake -S . -B build-mac -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_PREFIX_PATH="$(brew --prefix qt)"
      - name: Build
        run: cmake --build build-mac
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build-mac --output-on-failure
      - name: Package app
        run: ditto -c -k --keepParent build-mac/hamclock-pro.app hamclock-pro-macos.zip
      - name: Check Info.plist
        run: |
          plutil -lint build-mac/hamclock-pro.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c "Print :LSApplicationCategoryType" build-mac/hamclock-pro.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" build-mac/hamclock-pro.app/Contents/Info.plist
          test -s build-mac/hamclock-pro.app/Contents/Resources/AppIcon.icns
          file build-mac/hamclock-pro.app/Contents/Resources/AppIcon.icns
      - name: Build unsigned dmg
        run: |
          macdeployqt build-mac/hamclock-pro.app -dmg
          mv build-mac/hamclock-pro.dmg hamclock-pro-macos-unsigned.dmg
      # Signing and notarization (issue #58). Main pushes and tags only, and every
      # step skips cleanly while the secrets are absent. Secrets are only passed
      # through env, never echoed; the keychain is temporary and deleted at the end.
      - name: Check signing secrets
        id: sign
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        env:
          CERT: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_PW: ${{ secrets.MACOS_CERT_PASSWORD }}
          KEY: ${{ secrets.ASC_KEY_P8_BASE64 }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          if [ -n "$CERT" ] && [ -n "$CERT_PW" ]; then echo "sign=true" >> "$GITHUB_OUTPUT"; else echo "Developer ID certificate secrets absent; skipping signing"; fi
          if [ -n "$KEY" ] && [ -n "$KEY_ID" ] && [ -n "$ISSUER" ]; then echo "notarize=true" >> "$GITHUB_OUTPUT"; else echo "App Store Connect API key secrets absent; skipping notarization"; fi
      - name: Sign app and dmg (Developer ID)
        if: steps.sign.outputs.sign == 'true'
        env:
          CERT: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_PW: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/signing.keychain-db"
          KCPW="$(uuidgen)"
          echo "KC=$KC" >> "$GITHUB_ENV"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          printf '%s' "$CERT" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PW" -A -t cert -f pkcs12 -k "$KC" >/dev/null
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KCPW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" login.keychain-db
          IDENTITY="$(security find-identity -v -p codesigning "$KC" | grep 'Developer ID Application' | head -1 | awk -F'"' '{print $2}')"
          test -n "$IDENTITY" || { echo "No Developer ID Application identity in the p12"; exit 1; }
          APP=build-mac/hamclock-pro.app
          find "$APP/Contents" \( -name '*.dylib' -o -name '*.framework' -o -name '*.so' \) -print0 | \
            xargs -0 -n1 codesign --force --options runtime --timestamp --sign "$IDENTITY"
          codesign --force --options runtime --timestamp --sign "$IDENTITY" "$APP"
          codesign --verify --deep --strict "$APP"
          rm -rf dmgroot && mkdir dmgroot && cp -R "$APP" dmgroot/ && ln -s /Applications dmgroot/Applications
          hdiutil create -volname "HamClock Pro" -srcfolder dmgroot -ov -format UDZO hamclock-pro-macos.dmg
          codesign --force --timestamp --sign "$IDENTITY" hamclock-pro-macos.dmg
      - name: Notarize and staple
        if: steps.sign.outputs.sign == 'true' && steps.sign.outputs.notarize == 'true'
        env:
          KEY: ${{ secrets.ASC_KEY_P8_BASE64 }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          printf '%s' "$KEY" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          xcrun notarytool submit hamclock-pro-macos.dmg --key "$RUNNER_TEMP/AuthKey.p8" \
            --key-id "$KEY_ID" --issuer "$ISSUER" --wait
          rm -f "$RUNNER_TEMP/AuthKey.p8"
          xcrun stapler staple hamclock-pro-macos.dmg
          xcrun stapler validate hamclock-pro-macos.dmg
      - name: Remove signing keychain
        if: always() && steps.sign.outputs.sign == 'true'
        run: |
          security delete-keychain "$KC" || true
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/AuthKey.p8"
      - uses: actions/upload-artifact@v4
        if: steps.sign.outputs.sign == 'true'
        with:
          name: hamclock-pro-macos-signed
          path: hamclock-pro-macos.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: hamclock-pro-macos-unsigned
          path: |
            hamclock-pro-macos.zip
            hamclock-pro-macos-unsigned.dmg

  ios-simulator:
    name: iPad Simulator build
    runs-on: macos-14
    # Informational until the Qt Widgets dependency is removed (area A, QPainter
    # map renderer); a failure here does not block merges yet.
    continue-on-error: true
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Cache Qt install
        id: qt-cache
        uses: actions/cache@v4
        with:
          path: ~/Qt
          key: qt-${{ runner.os }}-${{ env.IOS_QT_VERSION }}-desktop-ios-v1
      - name: Install Qt (desktop host tools + iOS)
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: |
          python3 -m venv "$RUNNER_TEMP/aqt"
          "$RUNNER_TEMP/aqt/bin/pip" install aqtinstall
          AQT="$RUNNER_TEMP/aqt/bin/aqt"
          "$AQT" install-qt mac desktop "$IOS_QT_VERSION" clang_64 -m qtshadertools --outputdir "$HOME/Qt"
          "$AQT" install-qt mac ios "$IOS_QT_VERSION" ios --outputdir "$HOME/Qt"
      - name: Install ninja
        run: brew install ninja
      - name: Configure (device SDK)
        run: |
          "$HOME/Qt/$IOS_QT_VERSION/ios/bin/qt-cmake" -S . -B build-ios -G Xcode \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DQT_HOST_PATH="$HOME/Qt/$IOS_QT_VERSION/macos" \
            -DBUILD_TESTING=OFF
      - name: Build (compile and link check, unsigned)
        run: |
          cmake --build build-ios --config Debug --target hamclock-pro -- \
            -sdk iphoneos CODE_SIGNING_ALLOWED=NO
      # Simulator: Qt's prebuilt QML resource objects are device-only in this kit
      # ("building for iOS-simulator, but linking object built for iOS"), so the
      # Simulator build/screenshot is attempted separately and is informational.
      - name: Simulator build and screenshot (experimental)
        continue-on-error: true
        run: |
          "$HOME/Qt/$IOS_QT_VERSION/ios/bin/qt-cmake" -S . -B build-sim -G Xcode \
            -DCMAKE_OSX_SYSROOT=iphonesimulator -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DQT_HOST_PATH="$HOME/Qt/$IOS_QT_VERSION/macos" -DBUILD_TESTING=OFF
          cmake --build build-sim --config Debug --target hamclock-pro -- \
            -sdk iphonesimulator CODE_SIGNING_ALLOWED=NO
          APP=$(find build-sim -name 'hamclock-pro.app' -path '*Debug-iphonesimulator*' | head -1)
          UDID=$(xcrun simctl list devices available | grep -m1 'iPad' | grep -oE '[0-9A-F-]{36}')
          xcrun simctl boot "$UDID"
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" org.hamclockpro.app
          sleep 15
          xcrun simctl io "$UDID" screenshot ipad.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ipad-simulator-screenshot
          path: ipad.png
          if-no-files-found: ignore
