name: Apple

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Rapid merges to main used to cancel each other's runs, so the main-only
# signing/notarization path never completed. Only PR runs are superseded now;
# each main push gets its own group and runs to completion.
concurrency:
  group: apple-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Qt for iOS/macOS used by the iOS job. Shared code must still build on Qt 6.4.
  IOS_QT_VERSION: "6.8.3"

jobs:
  macos:
    name: macOS build and tests
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: brew install qt ninja
      - name: Configure
        run: cmake -S . -B build-mac -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_PREFIX_PATH="$(brew --prefix qt)"
      - name: Build
        run: cmake --build build-mac
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build-mac --output-on-failure
      - name: Package app
        run: ditto -c -k --keepParent build-mac/hamclock-pro.app hamclock-pro-macos.zip
      - name: Check Info.plist
        run: |
          plutil -lint build-mac/hamclock-pro.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c "Print :LSApplicationCategoryType" build-mac/hamclock-pro.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" build-mac/hamclock-pro.app/Contents/Info.plist
          test -s build-mac/hamclock-pro.app/Contents/Resources/AppIcon.icns
          file build-mac/hamclock-pro.app/Contents/Resources/AppIcon.icns
          plutil -lint build-mac/hamclock-pro.app/Contents/Resources/PrivacyInfo.xcprivacy
          /usr/libexec/PlistBuddy -c "Print :NSPrivacyTracking" build-mac/hamclock-pro.app/Contents/Resources/PrivacyInfo.xcprivacy
      - name: Build unsigned dmg
        run: |
          # macdeployqt can print an hdiutil "Resource busy" error yet exit 0,
          # so retry on a missing dmg rather than on the exit status.
          for attempt in 1 2 3; do
            rm -f build-mac/hamclock-pro.dmg
            macdeployqt build-mac/hamclock-pro.app -qmldir="$GITHUB_WORKSPACE/src" -dmg || true
            [ -f build-mac/hamclock-pro.dmg ] && break
            [ "$attempt" = 3 ] && exit 1
            sleep 15
          done
          # The QML is loaded from resources, so macdeployqt must scan src/ (-qmldir)
          # to bundle QtQuick, Controls, Layouts, ... Prove the packaged app starts.
          test -d build-mac/hamclock-pro.app/Contents/Resources/qml/QtQuick
          build-mac/hamclock-pro.app/Contents/MacOS/hamclock-pro --config-dir "$RUNNER_TEMP/smoke-mac" --offline --size 1024x600 --screenshot "$RUNNER_TEMP/smoke-mac.png"
          test -s "$RUNNER_TEMP/smoke-mac.png"
          mv build-mac/hamclock-pro.dmg hamclock-pro-macos-unsigned.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: hamclock-pro-macos-unsigned
          path: |
            hamclock-pro-macos.zip
            hamclock-pro-macos-unsigned.dmg

  macos-universal:
    name: macOS universal build
    runs-on: macos-14
    # Produces the distributable dmg: universal (arm64+x86_64), signed/notarized when secrets exist.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Cache Qt install
        id: qt-cache
        uses: actions/cache@v4
        with:
          path: ~/Qt
          key: qt-${{ runner.os }}-${{ env.IOS_QT_VERSION }}-desktop-v1
      - name: Install Qt (universal desktop)
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: |
          python3 -m venv "$RUNNER_TEMP/aqt"
          "$RUNNER_TEMP/aqt/bin/pip" install aqtinstall
          "$RUNNER_TEMP/aqt/bin/aqt" install-qt mac desktop "$IOS_QT_VERSION" clang_64 --outputdir "$HOME/Qt"
      - name: Install ninja
        run: brew install ninja
      - name: Configure and build (arm64 + x86_64)
        run: |
          cmake -S . -B build-universal -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_PREFIX_PATH="$HOME/Qt/$IOS_QT_VERSION/macos"
          cmake --build build-universal
      - name: Check both architectures
        run: |
          lipo -archs build-universal/hamclock-pro.app/Contents/MacOS/hamclock-pro | tee archs.txt
          grep -q arm64 archs.txt && grep -q x86_64 archs.txt
      - name: Deploy Qt into the bundle (universal)
        run: |
          export PATH="$HOME/Qt/$IOS_QT_VERSION/macos/bin:$PATH"
          # hdiutil occasionally fails with "Resource busy" on hosted runners; retry.
          for attempt in 1 2 3; do
            rm -f build-universal/hamclock-pro.dmg
            macdeployqt build-universal/hamclock-pro.app -qmldir="$GITHUB_WORKSPACE/src" -dmg || true
            [ -f build-universal/hamclock-pro.dmg ] && break
            [ "$attempt" = 3 ] && exit 1
            sleep 15
          done
          # The QML is loaded from resources, so macdeployqt must scan src/ (-qmldir)
          # to bundle QtQuick, Controls, Layouts, ... Prove the packaged app starts.
          test -d build-universal/hamclock-pro.app/Contents/Resources/qml/QtQuick
          build-universal/hamclock-pro.app/Contents/MacOS/hamclock-pro --config-dir "$RUNNER_TEMP/smoke-universal" --offline --size 1024x600 --screenshot "$RUNNER_TEMP/smoke-universal.png"
          test -s "$RUNNER_TEMP/smoke-universal.png"
          mv build-universal/hamclock-pro.dmg hamclock-pro-macos-universal-unsigned.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: hamclock-pro-macos-universal-unsigned
          path: hamclock-pro-macos-universal-unsigned.dmg
      # Signing and notarization (issue #58). Main pushes and tags only, and every
      # step skips cleanly while the secrets are absent. Secrets are only passed
      # through env, never echoed; the keychain is temporary and deleted at the end.
      - name: Check signing secrets
        id: sign
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        env:
          CERT: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_PW: ${{ secrets.MACOS_CERT_PASSWORD }}
          KEY: ${{ secrets.ASC_KEY_P8_BASE64 }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          if [ -n "$CERT" ] && [ -n "$CERT_PW" ]; then echo "sign=true" >> "$GITHUB_OUTPUT"; else echo "Developer ID certificate secrets absent; skipping signing"; fi
          if [ -n "$KEY" ] && [ -n "$KEY_ID" ] && [ -n "$ISSUER" ]; then echo "notarize=true" >> "$GITHUB_OUTPUT"; else echo "App Store Connect API key secrets absent; skipping notarization"; fi
      - name: Sign app and dmg (Developer ID)
        if: steps.sign.outputs.sign == 'true'
        env:
          CERT: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_PW: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/signing.keychain-db"
          KCPW="$(uuidgen)"
          echo "KC=$KC" >> "$GITHUB_ENV"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          printf '%s' "$CERT" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PW" -A -t cert -f pkcs12 -k "$KC" >/dev/null
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KCPW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" login.keychain-db
          IDENTITY="$(security find-identity -v -p codesigning "$KC" | grep 'Developer ID Application' | head -1 | awk -F'"' '{print $2}')"
          test -n "$IDENTITY" || { echo "No Developer ID Application identity in the p12"; exit 1; }
          APP=build-universal/hamclock-pro.app
          find "$APP/Contents" \( -name '*.dylib' -o -name '*.framework' -o -name '*.so' \) -print0 | \
            xargs -0 -n1 codesign --force --options runtime --timestamp --sign "$IDENTITY"
          codesign --force --options runtime --timestamp --sign "$IDENTITY" "$APP"
          codesign --verify --deep --strict "$APP"
          rm -rf dmgroot && mkdir dmgroot && cp -R "$APP" dmgroot/ && ln -s /Applications dmgroot/Applications
          hdiutil create -volname "HamClock Pro" -srcfolder dmgroot -ov -format UDZO hamclock-pro-macos.dmg
          codesign --force --timestamp --sign "$IDENTITY" hamclock-pro-macos.dmg
      - name: Notarize and staple
        if: steps.sign.outputs.sign == 'true' && steps.sign.outputs.notarize == 'true'
        env:
          KEY: ${{ secrets.ASC_KEY_P8_BASE64 }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          printf '%s' "$KEY" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          xcrun notarytool submit hamclock-pro-macos.dmg --key "$RUNNER_TEMP/AuthKey.p8" \
            --key-id "$KEY_ID" --issuer "$ISSUER" --wait
          rm -f "$RUNNER_TEMP/AuthKey.p8"
          xcrun stapler staple hamclock-pro-macos.dmg
          xcrun stapler validate hamclock-pro-macos.dmg
      - name: Remove signing keychain
        if: always() && steps.sign.outputs.sign == 'true'
        run: |
          security delete-keychain "$KC" || true
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/AuthKey.p8"
      - uses: actions/upload-artifact@v4
        if: steps.sign.outputs.sign == 'true'
        with:
          name: hamclock-pro-macos-signed
          path: hamclock-pro-macos.dmg

  # iPhone/iPad home-screen widgets (apple/widgets, docs/widgets-ios.md): a native
  # WidgetKit extension over the Qt-free core shared with the Apple TV app. Builds
  # the extension for devices and the Simulator, runs its unit tests, renders PNG
  # snapshots of every widget family, and checks the system registers the
  # extension in a Simulator. The device .appex is handed to the iPad jobs below.
  ios-widgets:
    name: iPhone widgets (WidgetKit extension, tests, snapshots)
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: brew install ninja xcodegen
      - name: Select Xcode 26 (current XcodeGen project format; same SDK as the TestFlight job)
        run: |
          X=$(ls -d /Applications/Xcode_26*.app /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$X" ] || { ls /Applications | grep -i xcode; exit 1; }
          sudo xcode-select -s "$X"
          xcodebuild -version
      - name: Build the shared core for iOS (Simulator and devices)
        run: |
          for sdk in iphonesimulator iphoneos; do
            cmake -S cmake/TvOSCore -B "build-ios-core-$sdk" -G Ninja -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_OSX_SYSROOT=$sdk -DCMAKE_TOOLCHAIN_FILE="$PWD/cmake/IOSCoreToolchain.cmake"
            cmake --build "build-ios-core-$sdk" --target hamclock-core
            lipo -info "build-ios-core-$sdk/libhamclock-core.a"
          done
      - name: Pick an iPhone Simulator
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          for rt,devs in sorted(d.items(), reverse=True):
              if "iOS" in rt:
                  for dev in devs:
                      if dev["name"].startswith("iPhone"):
                          print(dev["udid"]); sys.exit()')
          test -n "$udid"
          echo "SIM=$udid" >> "$GITHUB_ENV"
      - name: Unit tests and widget snapshots (Simulator)
        env:
          TEST_RUNNER_SNAPSHOT_DIR: ${{ github.workspace }}/widget-snapshots
        run: |
          cd apple/widgets
          xcodegen generate
          set -o pipefail
          xcodebuild test -project HamClockWidgets.xcodeproj -scheme HamClockWidgetsTests \
            -destination "id=$SIM" -derivedDataPath "$RUNNER_TEMP/dd-tests" \
            -resultBundlePath "$RUNNER_TEMP/widget-tests.xcresult" 2>&1 | tee "$RUNNER_TEMP/widget-tests.log" | \
            grep -E "error:|Test Case .* failed|Executed|\*\* TEST" || true
          grep -q '\*\* TEST SUCCEEDED \*\*' "$RUNNER_TEMP/widget-tests.log"
          ls "$TEST_RUNNER_SNAPSHOT_DIR"
          test "$(ls "$TEST_RUNNER_SNAPSHOT_DIR"/*.png | wc -l)" -ge 10
      - name: Build the extension for devices (unsigned) and the Simulator host
        run: |
          cd apple/widgets
          VERSION=$(sed -nE 's/^project\(HamClockPro VERSION ([0-9.]+).*/\1/p' "$GITHUB_WORKSPACE/CMakeLists.txt")
          [ -n "$VERSION" ]
          set -o pipefail
          # Same version and build as the iPad jobs' app (HAMCLOCK_BUILD_NUMBER defaults to 1);
          # App Store validation requires an extension's versions to match its app.
          xcodebuild build -project HamClockWidgets.xcodeproj -target HamClockWidgets -sdk iphoneos \
            -configuration Release ARCHS=arm64 SYMROOT="$RUNNER_TEMP/widgets" \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION=1 CODE_SIGNING_ALLOWED=NO 2>&1 | tail -3
          xcodebuild build -project HamClockWidgets.xcodeproj -target WidgetHost -sdk iphonesimulator \
            -configuration Debug ARCHS=arm64 SYMROOT="$RUNNER_TEMP/widgets" \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION=1 CODE_SIGNING_ALLOWED=NO 2>&1 | tail -3
          plutil -p "$RUNNER_TEMP/widgets/Release-iphoneos/HamClockWidgets.appex/Info.plist" | \
            grep -E "CFBundleIdentifier|Version|MinimumOSVersion|NSExtensionPointIdentifier"
          mkdir -p appex
          ditto -c -k --keepParent "$RUNNER_TEMP/widgets/Release-iphoneos/HamClockWidgets.appex" appex/HamClockWidgets-iphoneos.zip
          ditto -c -k --keepParent "$RUNNER_TEMP/widgets/Debug-iphonesimulator/HamClockWidgets.appex" appex/HamClockWidgets-iphonesimulator.zip
      - name: The system registers the extension (Simulator)
        run: |
          xcrun simctl boot "$SIM" || true
          xcrun simctl bootstatus "$SIM" -b
          xcrun simctl install "$SIM" "$RUNNER_TEMP/widgets/Debug-iphonesimulator/WidgetHost.app"
          for i in 1 2 3 4 5 6; do
            xcrun simctl spawn "$SIM" pluginkit -m -p com.apple.widgetkit-extension | tee plugins.txt
            grep -q com.chrislaw.hamclockpro.widgets plugins.txt && break
            sleep 5
          done
          grep -q com.chrislaw.hamclockpro.widgets plugins.txt
          xcrun simctl shutdown "$SIM" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-widget-snapshots
          path: widget-snapshots/*.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: ios-widget-appex
          path: apple/widgets/appex/*.zip

  ios-simulator:
    name: iPad Simulator build
    needs: ios-widgets
    # Runs (informational, like before) even when the widget job failed.
    if: ${{ !cancelled() }}
    runs-on: macos-14
    # Informational until the Qt Widgets dependency is removed (area A, QPainter
    # map renderer); a failure here does not block merges yet.
    continue-on-error: true
    timeout-minutes: 45
    env:
      # Qt 6.8.3's prebuilt QML resource objects are device-only (simulator link
      # fails); try the 6.5 LTS kit, which also checks our Qt 6.4+ compatibility.
      IOS_QT_VERSION: 6.5.3
    steps:
      - uses: actions/checkout@v4
      - name: Cache Qt install
        id: qt-cache
        uses: actions/cache@v4
        with:
          path: ~/Qt
          key: qt-${{ runner.os }}-${{ env.IOS_QT_VERSION }}-desktop-ios-v1
      - name: Install Qt (desktop host tools + iOS)
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: |
          python3 -m venv "$RUNNER_TEMP/aqt"
          "$RUNNER_TEMP/aqt/bin/pip" install aqtinstall
          AQT="$RUNNER_TEMP/aqt/bin/aqt"
          "$AQT" install-qt mac desktop "$IOS_QT_VERSION" clang_64 -m qtshadertools --outputdir "$HOME/Qt"
          "$AQT" install-qt mac ios "$IOS_QT_VERSION" ios --outputdir "$HOME/Qt"
      - name: Install ninja
        run: brew install ninja
      - name: Configure (device SDK)
        run: |
          "$HOME/Qt/$IOS_QT_VERSION/ios/bin/qt-cmake" -S . -B build-ios -G Xcode \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DQT_HOST_PATH="$HOME/Qt/$IOS_QT_VERSION/macos" \
            -DBUILD_TESTING=OFF
      - name: Build (compile and link check, unsigned)
        run: |
          cmake --build build-ios --config Debug --target hamclock-pro -- \
            -sdk iphoneos CODE_SIGNING_ALLOWED=NO
      - name: Check static QML plugins are linked (launch smoke test, #521)
        run: |
          BIN=$(find build-ios -path '*Debug-iphoneos/hamclock-pro.app/hamclock-pro' | head -1)
          echo "binary: $BIN"
          packaging/apple/check_ios_plugins.sh "$BIN"
      - name: Download the widget extension
        id: appex
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ios-widget-appex
          path: appex
      - name: Embed the widget extension in the device app (unsigned check)
        if: steps.appex.outcome == 'success'
        run: |
          APP=$(find build-ios -path '*Debug-iphoneos/hamclock-pro.app' -type d | head -1)
          ditto -x -k appex/HamClockWidgets-iphoneos.zip "$RUNNER_TEMP/appex-device"
          packaging/apple/embed_widgets.sh "$APP" "$RUNNER_TEMP/appex-device/HamClockWidgets.appex"
          ls "$APP/PlugIns"
      # Simulator: Qt's prebuilt QML resource objects are device-only in this kit
      # ("building for iOS-simulator, but linking object built for iOS"), so the
      # Simulator build/screenshot is attempted separately and is informational.
      - name: Simulator build and screenshot (experimental)
        continue-on-error: true
        run: |
          # Qt's iOS kit ships its QML resource objects tagged for the device
          # only (LC_BUILD_VERSION platform iOS), which the simulator link
          # rejects. The code is plain arm64, so retag those objects for the
          # simulator. The device build above has already run, so changing the
          # local kit copy is safe (the cache is not saved on a hit).
          QTIOS="$HOME/Qt/$IOS_QT_VERSION/ios"
          find "$QTIOS" -path '*objects-*' -name '*.o' > objs.txt
          echo "retagging $(wc -l < objs.txt) objects"
          head -1 objs.txt | xargs xcrun vtool -show-build | head -8
          # (a while loop: BSD xargs -I limits the replaced command to 255 bytes)
          while IFS= read -r o; do
            xcrun vtool -set-build-version 7 15.0 17.5 -replace -output "$o" "$o" >/dev/null 2>&1 ||
              xcrun vtool -arch arm64 -set-build-version 7 15.0 17.5 -replace -output "$o" "$o" >/dev/null ||
              echo "retag failed: $o"
          done < objs.txt
          head -1 objs.txt | xargs xcrun vtool -show-build | head -8
          # The kit's static libraries (libQt6Quick_debug.a, ...) carry the same
          # device tag on their members: unpack, retag and repack each archive.
          find "$QTIOS" -name '*.a' > archives.txt
          echo "retagging members of $(wc -l < archives.txt) archives"
          while IFS= read -r a; do
            if [ -n "$(xcrun ar -t "$a" 2>/dev/null | grep -v '^__.SYMDEF' | sort | uniq -d | head -1)" ]; then
              echo "skip (duplicate member names): $a"; continue
            fi
            d=$(mktemp -d)
            ( cd "$d" && xcrun ar -x "$a" ) || { echo "unpack failed: $a"; rm -rf "$d"; continue; }
            for m in "$d"/*.o; do
              [ -e "$m" ] || continue
              xcrun vtool -set-build-version 7 15.0 17.5 -replace -output "$m" "$m" >/dev/null 2>&1 ||
                xcrun vtool -arch arm64 -set-build-version 7 15.0 17.5 -replace -output "$m" "$m" >/dev/null 2>&1 ||
                echo "retag failed: $m"
            done
            xcrun libtool -static -o "$d/new.a" "$d"/*.o 2>/dev/null && cp "$d/new.a" "$a" || echo "repack failed: $a"
            rm -rf "$d"
          done < archives.txt
          "$HOME/Qt/$IOS_QT_VERSION/ios/bin/qt-cmake" -S . -B build-sim -G Xcode \
            -DQT_HOST_PATH="$HOME/Qt/$IOS_QT_VERSION/macos" -DBUILD_TESTING=OFF
          if ! cmake --build build-sim --config Debug --target hamclock-pro -- \
              -sdk iphonesimulator -arch arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO \
              > sim-build.log 2>&1; then
            grep -E "error:|ld: |BUILD FAILED" sim-build.log | head -40
            exit 1
          fi
          APP=$(find build-sim -name 'hamclock-pro.app' -path '*Debug-iphonesimulator*' | head -1)
          UDID=$(xcrun simctl list devices available | grep -m1 'iPad' | grep -oE '[0-9A-F-]{36}')
          # Widgets: embed the Simulator build of the extension (from the ios-widgets job).
          if [ -f appex/HamClockWidgets-iphonesimulator.zip ]; then
            ditto -x -k appex/HamClockWidgets-iphonesimulator.zip "$RUNNER_TEMP/appex-sim"
            packaging/apple/embed_widgets.sh "$APP" "$RUNNER_TEMP/appex-sim/HamClockWidgets.appex" || echo "widget extension not embedded"
          fi
          xcrun simctl boot "$UDID"
          xcrun simctl install "$UDID" "$APP"
          if [ -d "$APP/PlugIns/HamClockWidgets.appex" ]; then
            sleep 5
            xcrun simctl spawn "$UDID" pluginkit -m -p com.apple.widgetkit-extension | grep com.chrislaw.hamclockpro.widgets ||
              echo "widget extension not registered in the Simulator"
          fi
          # Take the bundle id from the built app (the iOS target uses
          # HAMCLOCK_IOS_BUNDLE_ID, not the macOS identifier).
          BID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")
          # The sky finder is off for 1.0: no camera/location/motion prompts, and
          # the plist placeholder must have been substituted.
          if grep -q 'HAMCLOCK_SKY_FINDER' "$APP/Info.plist" ||
             plutil -p "$APP/Info.plist" | grep -qE 'NS(Camera|LocationWhenInUse|Motion)UsageDescription'; then
            echo "Info.plist has sky finder permission strings or an unsubstituted placeholder"
            plutil -p "$APP/Info.plist"
            exit 1
          fi
          echo "launching $BID"
          xcrun simctl launch "$UDID" "$BID" | tee launch.txt
          PID=$(awk -F': ' '{print $2}' launch.txt | tr -d ' ')
          sleep 15
          xcrun simctl io "$UDID" screenshot ipad.png
          # Launch smoke test (#521): the process must still be alive after
          # 15 s, otherwise the app crashed on start (e.g. a missing plugin).
          if ! xcrun simctl spawn "$UDID" launchctl list | grep -q "UIKitApplication:$BID"; then
            echo "app is not running after launch: likely crashed on start"
            xcrun simctl spawn "$UDID" log show --last 1m --predicate "process == 'hamclock-pro'" 2>/dev/null | tail -40 || true
            exit 1
          fi
          echo "app still running after 15 s (pid ${PID:-unknown})"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ipad-simulator-screenshot
          path: ipad.png
          if-no-files-found: ignore

  # TestFlight upload of the iPad device build (issue #269). Main pushes only;
  # every step skips cleanly while the App Store Connect secrets or APPLE_TEAM_ID
  # are absent. Cloud signing uses the API key, so no certificate or profile is
  # stored in the repo. The key file is deleted at the end; nothing is echoed.
  # Owner switch: uploads run only while the repository variable
  # TESTFLIGHT_UPLOADS is 'true'. The owner paused TestFlight until builds are
  # stable (2026-10-16); don't remove or bypass this condition.
  ios-testflight:
    name: iPad TestFlight upload
    runs-on: macos-15
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.TESTFLIGHT_UPLOADS == 'true'
    continue-on-error: true
    timeout-minutes: 60
    env:
      QT_VER: "6.8.3"
      BUNDLE_ID: com.chrislaw.hamclockpro
    steps:
      - uses: actions/checkout@v4
      # App Store Connect only accepts builds from the iOS 26 SDK (Xcode 26).
      - name: Select Xcode 26
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$X" ] || { echo "no Xcode 26 on this runner"; ls /Applications | grep -i xcode; exit 1; }
          sudo xcode-select -s "$X"
          xcodebuild -version
      - name: Check secrets
        id: gate
        env:
          KEY: ${{ secrets.ASC_KEY_P8_BASE64 }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          TEAM: ${{ vars.APPLE_TEAM_ID }}
          DIST: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          DIST_PW: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          if [ -n "$KEY" ] && [ -n "$KEY_ID" ] && [ -n "$ISSUER" ] && [ -n "$TEAM" ] && [ -n "$DIST" ] && [ -n "$DIST_PW" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; else echo "App Store Connect or Apple Distribution secrets or APPLE_TEAM_ID absent; skipping TestFlight"; fi
      - name: Cache Qt install
        if: steps.gate.outputs.go == 'true'
        id: qt-cache
        uses: actions/cache@v4
        with:
          path: ~/Qt
          key: qt-${{ runner.os }}-${{ env.QT_VER }}-desktop-ios-v1
      - name: Install Qt (desktop host tools + iOS)
        if: steps.gate.outputs.go == 'true' && steps.qt-cache.outputs.cache-hit != 'true'
        run: |
          python3 -m venv "$RUNNER_TEMP/aqt"
          "$RUNNER_TEMP/aqt/bin/pip" install aqtinstall
          AQT="$RUNNER_TEMP/aqt/bin/aqt"
          "$AQT" install-qt mac desktop "$QT_VER" clang_64 -m qtshadertools --outputdir "$HOME/Qt"
          "$AQT" install-qt mac ios "$QT_VER" ios --outputdir "$HOME/Qt"
      - name: Configure
        if: steps.gate.outputs.go == 'true'
        env:
          TEAM: ${{ vars.APPLE_TEAM_ID }}
        run: |
          brew install ninja
          "$HOME/Qt/$QT_VER/ios/bin/qt-cmake" -S . -B build-tf -G Xcode \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DQT_HOST_PATH="$HOME/Qt/$QT_VER/macos" \
            -DBUILD_TESTING=OFF \
            -DCMAKE_XCODE_ATTRIBUTE_DEVELOPMENT_TEAM="$TEAM" \
            -DCMAKE_XCODE_ATTRIBUTE_PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_STYLE=Automatic \
            -DCMAKE_XCODE_ATTRIBUTE_TARGETED_DEVICE_FAMILY=2
      # Widgets (docs/widgets-ios.md): built unsigned here, embedded and signed after
      # the archive below. Optional: if this fails, or the App Group is not set up on
      # the App IDs yet, the app uploads without widgets, as before.
      - name: Build the widget extension (devices, unsigned)
        id: widgets
        if: steps.gate.outputs.go == 'true'
        continue-on-error: true
        run: |
          brew install xcodegen
          cmake -S cmake/TvOSCore -B build-ios-core-iphoneos -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_SYSROOT=iphoneos -DCMAKE_TOOLCHAIN_FILE="$PWD/cmake/IOSCoreToolchain.cmake"
          cmake --build build-ios-core-iphoneos --target hamclock-core
          VERSION=$(sed -nE 's/^project\(HamClockPro VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)
          [ -n "$VERSION" ]
          cd apple/widgets
          xcodegen generate
          set -o pipefail
          # Versions must match the app's: MARKETING_VERSION is the CMake project version
          # (AppleBundle.cmake), the build number is this run's number (archive step below).
          xcodebuild build -project HamClockWidgets.xcodeproj -target HamClockWidgets -sdk iphoneos \
            -configuration Release ARCHS=arm64 SYMROOT="$RUNNER_TEMP/widgets" \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tail -3
          test -d "$RUNNER_TEMP/widgets/Release-iphoneos/HamClockWidgets.appex"
      - name: Import Apple Distribution certificate
        if: steps.gate.outputs.go == 'true'
        env:
          DIST: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          DIST_PW: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/ios-signing.keychain-db"
          KCPW="$(uuidgen)"
          echo "KC=$KC" >> "$GITHUB_ENV"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          printf '%s' "$DIST" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -P "$DIST_PW" -A -t cert -f pkcs12 -k "$KC" >/dev/null
          rm -f "$RUNNER_TEMP/dist.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KCPW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" login.keychain-db
          security find-identity -v -p codesigning "$KC" | grep -c 'Apple Distribution' || { echo "No Apple Distribution identity in the p12"; exit 1; }
      - name: Archive, export and upload
        if: steps.gate.outputs.go == 'true'
        env:
          KEY: ${{ secrets.ASC_KEY_P8_BASE64 }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          TEAM: ${{ vars.APPLE_TEAM_ID }}
        run: |
          KEYFILE="$RUNNER_TEMP/AuthKey_$KEY_ID.p8"
          printf '%s' "$KEY" | base64 --decode > "$KEYFILE"
          trap 'rm -f "$KEYFILE"' EXIT
          # Manual signing: the App Store profile is created through the API (the
          # key's App Manager role cannot create cloud-managed distribution profiles).
          python3 -m venv "$RUNNER_TEMP/asc"
          "$RUNNER_TEMP/asc/bin/pip" install --quiet pyjwt cryptography
          export ASC_KEY_FILE="$KEYFILE" ASC_KEY_ID="$KEY_ID" ASC_ISSUER_ID="$ISSUER"
          security find-certificate -c "Apple Distribution" -p "$KC" > "$RUNNER_TEMP/dist.pem"
          PROFILE_NAME="HamClockPro AppStore ${{ github.run_id }}"
          read -r PROFILE_ID PROFILE_UUID < <("$RUNNER_TEMP/asc/bin/python" packaging/apple/asc_profile.py \
            create "$BUNDLE_ID" "$RUNNER_TEMP/dist.pem" "$PROFILE_NAME" "$RUNNER_TEMP/profile.mobileprovision")
          echo "PROFILE_ID=$PROFILE_ID" >> "$GITHUB_ENV"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          # Build number must rise on every upload: use the run number.
          BUILD="${{ github.run_number }}"
          # Widgets go in only when everything is ready: the extension built, its bundle id
          # (com.chrislaw.hamclockpro.widgets) is registered, and both App Store profiles carry
          # the App Group (the owner enables it in the developer portal, docs/widgets-ios.md).
          # Otherwise the app uploads exactly as before, with a warning.
          GROUP=group.com.chrislaw.hamclockpro
          WIDGET_ID="$BUNDLE_ID.widgets"
          WIDGET_PROFILE_NAME="HamClockPro Widgets AppStore ${{ github.run_id }}"
          APPEX="$RUNNER_TEMP/widgets/Release-iphoneos/HamClockWidgets.appex"
          has_group() {
            security cms -D -i "$1" > "$RUNNER_TEMP/check.plist" &&
              /usr/libexec/PlistBuddy -c "Print :Entitlements:com.apple.security.application-groups" \
                "$RUNNER_TEMP/check.plist" 2>/dev/null | grep -qF "$GROUP"
          }
          WIDGETS=no
          if [ "${{ steps.widgets.outcome }}" != success ] || [ ! -d "$APPEX" ]; then
            echo "::warning::Widget extension did not build; uploading without widgets"
          elif ! has_group "$RUNNER_TEMP/profile.mobileprovision"; then
            echo "::warning::App Group $GROUP is not on the $BUNDLE_ID App ID yet; uploading without widgets (docs/widgets-ios.md)"
          elif ! W_OUT=$("$RUNNER_TEMP/asc/bin/python" packaging/apple/asc_profile.py \
                create "$WIDGET_ID" "$RUNNER_TEMP/dist.pem" "$WIDGET_PROFILE_NAME" "$RUNNER_TEMP/widgets.mobileprovision"); then
            echo "::warning::Could not create a profile for $WIDGET_ID (App ID not registered?); uploading without widgets"
          else
            read -r W_PROFILE_ID W_PROFILE_UUID <<< "$W_OUT"
            echo "W_PROFILE_ID=$W_PROFILE_ID" >> "$GITHUB_ENV"
            if has_group "$RUNNER_TEMP/widgets.mobileprovision"; then
              WIDGETS=yes
              cp "$RUNNER_TEMP/widgets.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$W_PROFILE_UUID.mobileprovision"
            else
              echo "::warning::App Group $GROUP is not on the $WIDGET_ID App ID yet; uploading without widgets"
            fi
          fi
          echo "Widgets embedded: $WIDGETS"
          WIDGET_PROFILE_ENTRY=""
          ENTITLEMENT_ARGS=()
          if [ "$WIDGETS" = yes ]; then
            WIDGET_PROFILE_ENTRY="<key>$WIDGET_ID</key><string>$WIDGET_PROFILE_NAME</string>"
            ENTITLEMENT_ARGS=(CODE_SIGN_ENTITLEMENTS="$GITHUB_WORKSPACE/packaging/apple/hamclock-pro.entitlements")
          fi
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>$TEAM</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key><dict><key>$BUNDLE_ID</key><string>$PROFILE_NAME</string>$WIDGET_PROFILE_ENTRY</dict>
          </dict></plist>
          PLIST
          set -o pipefail
          xcodebuild archive -project build-tf/HamClockPro.xcodeproj -scheme hamclock-pro \
            -configuration Release -sdk iphoneos -archivePath "$RUNNER_TEMP/hc.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM" PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CURRENT_PROJECT_VERSION="$BUILD" CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KC" "${ENTITLEMENT_ARGS[@]}" \
            2>&1 | tee tf-archive.log | tail -5 \
            || { grep -E "error:|BUILD FAILED" tf-archive.log | head -30; exit 1; }
          # Diagnostics: an app archive has Products/Applications and ApplicationProperties.
          ls "$RUNNER_TEMP/hc.xcarchive/Products" "$RUNNER_TEMP/hc.xcarchive/Products/Applications" || true
          /usr/libexec/PlistBuddy -c Print "$RUNNER_TEMP/hc.xcarchive/Info.plist" | grep -v -i "signing" || true
          if [ "$WIDGETS" = yes ]; then
            # Embed into the archived app, sign the extension with its own profile, then
            # re-sign the app (its seal covers PlugIns/) with the entitlements Xcode gave it.
            APPDIR="$RUNNER_TEMP/hc.xcarchive/Products/Applications/hamclock-pro.app"
            packaging/apple/embed_widgets.sh "$APPDIR" "$APPEX"
            EXT="$APPDIR/PlugIns/HamClockWidgets.appex"
            cp "$RUNNER_TEMP/widgets.mobileprovision" "$EXT/embedded.mobileprovision"
            IDENT=$(security find-identity -v -p codesigning "$KC" | awk '/Apple Distribution/ {print $2; exit}')
            security cms -D -i "$RUNNER_TEMP/widgets.mobileprovision" > "$RUNNER_TEMP/widgets-profile.plist"
            /usr/libexec/PlistBuddy -x -c "Print :Entitlements" "$RUNNER_TEMP/widgets-profile.plist" > "$RUNNER_TEMP/widgets.entitlements"
            # The profile allows a wildcard keychain group; the extension uses no keychain.
            /usr/libexec/PlistBuddy -c "Delete :keychain-access-groups" "$RUNNER_TEMP/widgets.entitlements" 2>/dev/null || true
            codesign --force --sign "$IDENT" --keychain "$KC" --timestamp=none \
              --entitlements "$RUNNER_TEMP/widgets.entitlements" "$EXT"
            codesign -d --entitlements - --xml "$APPDIR" > "$RUNNER_TEMP/app.entitlements"
            grep -qF "$GROUP" "$RUNNER_TEMP/app.entitlements" || { echo "app was archived without the App Group"; exit 1; }
            codesign --force --sign "$IDENT" --keychain "$KC" --timestamp=none \
              --entitlements "$RUNNER_TEMP/app.entitlements" "$APPDIR"
            codesign --verify --deep --strict "$APPDIR"
          fi
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/hc.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath "$KEYFILE" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER" \
            2>&1 | tee tf-export.log | tail -15 \
            || { grep -E "error:|rror Domain" tf-export.log | head -30; exit 1; }
      - name: Remove signing keychain and temporary profile
        if: always() && steps.gate.outputs.go == 'true'
        env:
          KEY: ${{ secrets.ASC_KEY_P8_BASE64 }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          if [ -n "$PROFILE_ID" ] && [ -x "$RUNNER_TEMP/asc/bin/python" ]; then
            printf '%s' "$KEY" | base64 --decode > "$RUNNER_TEMP/AuthKey_$KEY_ID.p8"
            ASC_KEY_FILE="$RUNNER_TEMP/AuthKey_$KEY_ID.p8" ASC_KEY_ID="$KEY_ID" ASC_ISSUER_ID="$ISSUER" \
              "$RUNNER_TEMP/asc/bin/python" packaging/apple/asc_profile.py delete "$PROFILE_ID" || true
          fi
          if [ -n "$W_PROFILE_ID" ] && [ -x "$RUNNER_TEMP/asc/bin/python" ]; then
            ASC_KEY_FILE="$RUNNER_TEMP/AuthKey_$KEY_ID.p8" ASC_KEY_ID="$KEY_ID" ASC_ISSUER_ID="$ISSUER" \
              "$RUNNER_TEMP/asc/bin/python" packaging/apple/asc_profile.py delete "$W_PROFILE_ID" || true
          fi
          security delete-keychain "$KC" || true
          rm -f "$RUNNER_TEMP/dist.p12" "$RUNNER_TEMP"/AuthKey_*.p8
