name: Release builds

# Every push to main publishes fresh downloadable builds as the rolling
# "latest" pre-release. Tagged versions (v*) get their own release.
on:
  push:
    branches: [main]
    tags: ['v*']
  # Build (but never publish) when packaging changes, so it is tested pre-merge.
  pull_request:
    paths: [CMakeLists.txt, .github/workflows/release.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  # Never cancel a running release: merges arrive faster than builds finish,
  # so cancelling meant no release ever completed. GitHub keeps only the newest
  # pending run queued behind the running one.
  cancel-in-progress: false

jobs:
  raspberry-pi:
    name: Raspberry Pi OS ${{ matrix.release }} ${{ matrix.arch }} (.deb)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # Trixie is the current Raspberry Pi OS; Bookworm is "Legacy".
        # armhf covers 32-bit Raspberry Pi OS on Pi 2/3/4/Zero 2.
        release: [trixie, bookworm]
        arch: [arm64, armhf]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64,arm
      - name: Build package in ${{ matrix.release }} ${{ matrix.arch }} container
        run: |
          # Date AND time so same-day builds upgrade cleanly (hash alone sorts arbitrarily).
          version="0.1.0~git$(date -u +%Y%m%d%H%M%S).${GITHUB_SHA::7}"
          [[ "$GITHUB_REF" == refs/tags/v* ]] && version="${GITHUB_REF_NAME#v}"
          platform=linux/arm64; [[ "${{ matrix.arch }}" == armhf ]] && platform=linux/arm/v7
          docker run --rm --platform "$platform" -v "$PWD":/src -w /src debian:${{ matrix.release }} bash -euxc "
            apt-get update
            apt-get install -y --no-install-recommends cmake g++ make qt6-base-dev qt6-declarative-dev dpkg-dev file
            cmake -S . -B build-pi -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DCPACK_PACKAGE_VERSION=$version
            cmake --build build-pi -j\$(nproc)
            cd build-pi && cpack -G DEB
          "
          # Same package version for every OS release; name files so they don't collide.
          for deb in build-pi/*.deb; do
            sudo mv "$deb" "${deb%_${{ matrix.arch }}.deb}_${{ matrix.release }}_${{ matrix.arch }}.deb"
          done
          ls -l build-pi/*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: hamclock-pro-raspberry-pi-${{ matrix.release }}-${{ matrix.arch }}
          path: build-pi/*.deb

  macos:
    name: macOS (Apple silicon app zip)
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt
        run: brew install qtbase qtdeclarative
      - name: Build
        run: |
          cmake -S . -B build-mac -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DCMAKE_PREFIX_PATH="$(brew --prefix)"
          cmake --build build-mac -j"$(sysctl -n hw.ncpu)"
      - name: Bundle Qt into the dashboard app and zip
        run: |
          cd build-mac
          "$(brew --prefix)/bin/macdeployqt" hamclock-pro.app -qmldir=../src
          ditto -c -k --keepParent hamclock-pro.app hamclock-pro-macos-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: hamclock-pro-macos-arm64
          path: build-mac/hamclock-pro-macos-arm64.zip

  publish:
    name: Publish release
    needs: [raspberry-pi, macos]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l dist
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            gh release create "$GITHUB_REF_NAME" dist/* --title "HamClock Pro $GITHUB_REF_NAME" --generate-notes
          else
            gh release delete latest --cleanup-tag --yes || true
            gh release create latest dist/* --target "$GITHUB_SHA" --prerelease \
              --title "Latest development build" \
              --notes "Automatic build of main at ${GITHUB_SHA::7}. Development preview: not feature complete, not hardware-validated. Raspberry Pi: pick the file matching your OS (trixie = current Raspberry Pi OS, bookworm = Legacy) and architecture (arm64 = 64-bit, armhf = 32-bit), then sudo apt install ./hamclock-pro_*.deb, then run hamclock-pro. macOS: unzip and open the app (unsigned; right-click > Open)."
          fi
