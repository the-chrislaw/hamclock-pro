name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qt:
    name: Qt build and tests (${{ matrix.config.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        config:
          - { name: debug, flags: "" }
          - { name: asan-ubsan, flags: "-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=undefined" }
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build g++ qt6-base-dev qt6-declarative-dev qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts qml6-module-qtquick-window qml6-module-qtquick-templates qml6-module-qtqml-workerscript python3
      - name: Configure
        run: cmake -S . -B build-ci -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="${{ matrix.config.flags }}"
      - name: Build
        run: cmake --build build-ci
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build-ci --output-on-failure
